apiVersion: v1
kind: ConfigMap
metadata:
  name: configmap-{{ include "log-api.fullname" . }}
  namespace: {{ .Release.Namespace }}
data:
  appsettings.json: |
    {
      "Logging": {
        "LogLevel": {
          "System.Net.Http.HttpClient": "Warning",
          "Tgs.LogApi.MessageQueue.AdminLogHandler": "Warning",
          "Tgs.LogApi.MessageQueue.ApiLogHandler": "Warning",
          "Tgs.LogApi.MessageQueue.LogRecordHandler": "Warning"
        }
      }
    }