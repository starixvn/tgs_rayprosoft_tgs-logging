# Default values for log-api.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: registry.gitlab.com/rayprosoft/turnkey-gaming-system/log-api
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "dev"

imagePullSecrets:
  - name: registry-credentials
nameOverride: "log-api"
fullnameOverride: "log-api"
namespace: dev

podAnnotations: {}

connectionStrings:
  tgs: Server=pgpool;Port=9999;Database=tgs;User Id=rpdev;Password=abcd1234
  redis: redis-master,abortConnect=false,connectTimeout=3000,password=1qaz2wsx

nats:
  urls: nats://nats-client:4222

notifyPath: telegram/dev/log-alert

podSecurityContext:
  {}
  # fsGroup: 2000

securityContext:
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000
  runAsUser: 0
  runAsGroup: 0

service:
  type: ClusterIP
  port: 80

resources:
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  limits:
    cpu: 400m
    memory: 1Gi
  requests:
    cpu: 400m
    memory: 1Gi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 60
  targetMemoryUtilizationPercentage: 60

nodeSelector: {}

tolerations: []

affinity: {}
